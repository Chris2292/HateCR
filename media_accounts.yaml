metadata:
  project: HateCR
  version: "0.2.0"
  last_updated: "2026-05-26"
  notes:
    - "Catalogo ampliado de cuentas de medios costarricenses para identificar posts madre."
    - "Los handles y user_ids deben validarse con API oficial antes de recolectar."

platform_policy:
  platform: "X"
  data_access: "official_api_only"
  credentials_source: ".env"
  prohibited_methods:
    - "aggressive_scraping"
    - "automation_to_bypass_restrictions"
    - "proxy_rotation_evasion"
    - "unauthorized_data_extraction"

account_selection_criteria:
  - "Cobertura nacional durante campana 2025-2026."
  - "Publicacion regular de contenido politico-electoral."
  - "Alto volumen potencial de respuestas/comentarios."

