integration_rules:
  link_field_in_events: "media_id"
  post_madre_definition: "Publicacion fuente emitida por cuenta de medio seleccionada."
  minimal_fields_for_source_post:
    - "event_id"
    - "media_id"
    - "source_post_id"
    - "source_post_text"
    - "source_post_created_at"
    - "source_post_url"
    - "source_post_public_metrics"
