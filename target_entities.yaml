metadata:
  project: HateCR
  version: "0.1.0"
  last_updated: "2026-07-16"
  purpose: "Catalogo auditable para inferir blancos probables de hostilidad y odio."
  notes:
    - "Una mencion no equivale automaticamente a un ataque."
    - "context_aliases solo se usan en el post madre y producen evidencia de baja confianza."
    - "Los medios activos se agregan desde config/media_accounts.yaml usando sus handles."
    - "potential_identity_basis indica una dimension posible; nunca confirma por si sola discurso de odio."
    - "mention_count_aliases amplia solo el censo de menciones y no interviene en la asignacion automatica del blanco."

settings:
  include_active_media_accounts: true
  media_handles_are_audit_only: true
  direct_offense_max_token_distance: 8

